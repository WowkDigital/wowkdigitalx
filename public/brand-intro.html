<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOWK DIGITAL X — Geometric Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --fg:#f2f2f2;
    --mid:#9a9a9a;
    --dim:#5c5c5c;
    --line:#333;
    --bg:#1b1b1b;
    --spd:1;
    --size:80;
    --cond:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;
    --mono:"JetBrains Mono","Consolas",monospace;
    --ease:cubic-bezier(.7,0,.15,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{font-family:var(--mono);color:var(--fg);cursor:none}
  @media (hover:none){body{cursor:auto}.cur,.cdot,.ccoord{display:none}}
  canvas#bg{position:fixed;inset:0;width:100%;height:100%}
  .vignette{position:fixed;inset:0;pointer-events:none;transition:opacity .4s;
    background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.6) 100%)}
  .stage{position:fixed;inset:0;display:grid;place-items:center;padding-bottom:9vh;pointer-events:none}
  svg#hud{width:min(calc(var(--size) * 1vmin),980px);height:min(calc(var(--size) * 1vmin),980px);overflow:visible;pointer-events:none}
  svg#hud .hit,svg#hud .hitFill,svg#hud .node{pointer-events:all}
  svg#hud .hit{pointer-events:stroke}

  .spin{transform-box:view-box;transform-origin:0 0}
  .cw  {animation:rot calc(60s / var(--spd)) linear infinite}
  .ccw {animation:rot calc(40s / var(--spd)) linear infinite reverse}
  .cw2 {animation:rot calc(24s / var(--spd)) linear infinite}
  .ccw2{animation:rot calc(16s / var(--spd)) linear infinite reverse}
  @keyframes rot{to{transform:rotate(360deg)}}

  .shape{fill:none;stroke:var(--fg);stroke-dasharray:1;stroke-dashoffset:1;transition:opacity .3s,stroke-width .3s}
  .run .shape{animation:draw 1.4s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .d1{animation-delay:.3s!important}.d2{animation-delay:.55s!important}.d3{animation-delay:.8s!important}

  .pop{opacity:0}
  .run .pop{animation:fadeIn .25s forwards}
  @keyframes fadeIn{to{opacity:1}}

  /* ---------- hover na elementach ---------- */
  .hit{fill:none;stroke:transparent}
  .hitFill{fill:transparent}
  .hov.hot{animation-play-state:paused}
  .hov.hot .shape{opacity:1!important;stroke-width:2.2px}
  .hov.hot .seg{stroke-width:9px}
  .hov.hot line.pop{stroke:var(--fg)!important}
  .node{transition:fill .25s,stroke-width .25s}
  .node.hot{fill:var(--fg)!important;stroke-width:3}

  /* ---------- logo ---------- */
  #logoStroke{fill:none;stroke:var(--fg);stroke-width:.8;stroke-dasharray:1;stroke-dashoffset:1}
  .run #logoStroke{animation:draw 2.2s cubic-bezier(.6,0,.3,1) 1.6s forwards}
  #logoHatch{fill:url(#hatch);opacity:0}
  .run #logoHatch{animation:hatchIn 2.2s ease 1.8s forwards}
  @keyframes hatchIn{0%{opacity:0}40%{opacity:.6}100%{opacity:0}}
  #logoEcho{fill:url(#hatch);opacity:0;transition:opacity .4s var(--ease),transform .5s var(--ease)}
  .logoHot #logoEcho{opacity:.55;transform:translate(6px,6px)}
  #logoEcho2{fill:none;stroke:var(--fg);stroke-width:.5;opacity:0;transition:opacity .4s,transform .5s var(--ease)}
  .logoHot #logoEcho2{opacity:.5;transform:translate(-5px,-5px)}
  #logoFill{fill:var(--fg);opacity:0}
  .run #logoFill{animation:fillIn .9s steps(1) 3.6s forwards}
  @keyframes fillIn{0%{opacity:1}10%{opacity:0}18%{opacity:1}26%{opacity:.15}34%{opacity:1}100%{opacity:1}}

  .slice{fill:var(--fg);opacity:0}
  .run .slice{animation:slice 6s steps(1) 4.6s infinite}
  .run .slice.s2{animation-name:slice2}
  @keyframes slice{0%{opacity:1;transform:translateX(-6px)}2%{transform:translateX(5px)}4%{opacity:0;transform:none}100%{opacity:0}}
  @keyframes slice2{0%{opacity:0}61%{opacity:1;transform:translateX(7px)}63%{transform:translateX(-3px)}65%{opacity:0;transform:none}100%{opacity:0}}
  .burst .slice{animation:burst .45s steps(1) 1!important}
  .burst .slice.s2{animation:burst2 .45s steps(1) 1!important}
  @keyframes burst{0%{opacity:1;transform:translateX(-9px)}30%{transform:translateX(6px)}60%{transform:translateX(-3px)}100%{opacity:0}}
  @keyframes burst2{0%{opacity:1;transform:translateX(8px)}40%{transform:translateX(-7px)}70%{transform:translateX(3px)}100%{opacity:0}}

  #scanBar{opacity:0}
  .run #scanBar{animation:scan 2.2s ease-in-out 1.6s 1 forwards}
  @keyframes scan{0%{opacity:0;transform:translateY(-140px)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(140px)}}

  .lock{fill:none;stroke:var(--fg);stroke-width:2;opacity:0}
  .run .lock{animation:lock 1s var(--ease) 3.3s forwards}
  @keyframes lock{0%{opacity:0;transform:scale(2.2) rotate(-90deg)}60%{opacity:1}100%{opacity:1;transform:none}}
  .lockWrap{transition:transform .5s var(--ease)}
  .logoHot .lockWrap{transform:scale(1.08)}
  .tag rect{fill:var(--fg)}
  .tag text{fill:var(--bg);font-family:var(--mono);font-size:10px;letter-spacing:2px;font-weight:500}
  .tag{opacity:0}
  .run .tag{animation:blinkIn .6s linear 4.1s forwards}
  @keyframes blinkIn{0%,24%{opacity:0}25%,49%{opacity:1}50%,74%{opacity:0}75%,100%{opacity:1}}

  .pulse{fill:none;stroke:var(--fg);opacity:0;transform-box:view-box;transform-origin:0 0}
  .run .pulse{animation:pulse 1.8s ease-out 3.7s forwards}
  .run .pulse.p2{animation-delay:4s}
  .run .pulse.again{animation:pulse 1.4s ease-out forwards}
  @keyframes pulse{0%{opacity:.9;transform:scale(.4) rotate(0);stroke-width:3}100%{opacity:0;transform:scale(1.7) rotate(30deg);stroke-width:.4}}

  /* ---------- kursor ---------- */
  .cur{position:fixed;left:0;top:0;width:24px;height:24px;border:1px solid #fff;pointer-events:none;z-index:1000;
    transition:width .3s var(--ease),height .3s var(--ease),border-width .2s;mix-blend-mode:difference}
  .cur::before,.cur::after{content:"";position:absolute;background:#fff}
  .cur::before{left:50%;top:-7px;width:1px;height:5px}
  .cur::after{top:50%;left:-7px;height:1px;width:5px}
  .cur.hot{width:52px;height:52px;border-width:2px}
  .cur.down{width:14px;height:14px}
  .cdot{position:fixed;left:0;top:0;width:4px;height:4px;background:#fff;pointer-events:none;z-index:1001;mix-blend-mode:difference}
  .ccoord{position:fixed;left:0;top:0;font-size:9px;letter-spacing:.12em;color:var(--dim);pointer-events:none;z-index:1000;white-space:nowrap;transition:opacity .2s}

  .tip{position:fixed;left:0;top:0;pointer-events:none;z-index:49;opacity:0;transform:translateY(6px);
    transition:opacity .2s,transform .3s var(--ease);font-size:10px;letter-spacing:.14em;min-width:180px}
  .tip.on{opacity:1;transform:none}
  .tip .h{background:var(--fg);color:var(--bg);padding:5px 9px;font-weight:500;display:flex;justify-content:space-between;gap:14px}
  .tip .b{border:1px solid #444;border-top:0;background:rgba(27,27,27,.9);padding:7px 9px;color:var(--mid);line-height:1.7}
  .tip .b b{color:var(--fg);font-weight:400}

  /* ---------- UI ---------- */
  .title{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);text-align:center;white-space:nowrap}
  .title h1{font-family:var(--cond);font-weight:800;font-size:clamp(34px,6vmin,68px);letter-spacing:.18em;line-height:1;min-height:1em;padding-left:.18em;transition:letter-spacing .6s var(--ease)}
  .title h1:hover{letter-spacing:.26em}
  .title h1 .o{color:transparent;-webkit-text-stroke:1.5px var(--fg);transition:color .35s}
  .title h1:hover .o{color:var(--fg)}
  .title p{margin-top:.9em;font-size:clamp(10px,1.3vmin,12px);letter-spacing:.45em;color:var(--mid);min-height:1.4em}
  .cursor::after{content:"▌";animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .panel{position:fixed;font-size:11px;line-height:1.7;letter-spacing:.14em;color:var(--dim)}
  .panel b{color:var(--fg);font-weight:400;transition:color .2s}
  .tl{top:36px;left:40px}
  .tr{top:36px;right:40px;text-align:right}
  .bl{bottom:36px;left:40px}
  .br{bottom:36px;right:40px;text-align:right}
  .panel .row{opacity:0;transition:opacity .3s,background .2s,color .2s,padding .3s var(--ease);padding:0 4px}
  .panel .row.on{opacity:1}
  .panel .row:hover{background:var(--fg);color:var(--bg)}
  .panel .row:hover b{color:var(--bg)}
  .tl .row:hover,.bl .row:hover{padding-left:14px}
  .tr .row:hover,.br .row:hover{padding-right:14px}
  .bar{display:inline-block;width:110px;height:7px;vertical-align:middle;margin-left:8px;
    background:repeating-linear-gradient(90deg,#3a3a3a 0 5px,transparent 5px 7px);position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;color:var(--fg);
    background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 7px)}
  .row:hover .bar i{color:var(--bg)}
  .sq{display:inline-block;width:7px;height:7px;border:1px solid var(--fg);margin-right:8px;vertical-align:middle}
  .sq.f{background:var(--fg)}
  .row:hover .sq{border-color:var(--bg)}
  .row:hover .sq.f{background:var(--bg)}

  .frame{position:fixed;inset:16px;pointer-events:none;border:1px solid var(--line);opacity:0}
  .run .frame{animation:fadeIn .6s .05s forwards}
  .corner{position:fixed;width:22px;height:22px;border:0 solid var(--fg);opacity:0;pointer-events:none}
  .run .corner{animation:fadeIn .3s .2s forwards}
  .corner.a{top:16px;left:16px;border-top-width:3px;border-left-width:3px}
  .corner.b{top:16px;right:16px;border-top-width:3px;border-right-width:3px}
  .corner.c{bottom:16px;left:16px;border-bottom-width:3px;border-left-width:3px}
  .corner.d{bottom:16px;right:16px;border-bottom-width:3px;border-right-width:3px}

  .hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.3em;color:#4a4a4a;pointer-events:none;white-space:nowrap}


  /* ---------- panel konfiguracji ---------- */
  .cfgBtn{position:fixed;top:28px;left:50%;transform:translateX(-50%);z-index:61;font:500 10px var(--mono);letter-spacing:.3em;
    color:var(--mid);background:var(--bg);border:1px solid var(--dim);padding:7px 14px 7px 16px;cursor:none;transition:.25s}
  .cfgBtn:hover,.cfgBtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .cfg{position:fixed;top:16px;right:16px;bottom:16px;width:320px;z-index:60;background:var(--bg);border:1px solid var(--dim);
    transform:translateX(calc(100% + 40px));transition:transform .55s var(--ease);overflow-y:auto;overflow-x:hidden;
    font-size:10px;letter-spacing:.14em;color:var(--mid);scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
  .cfg.open{transform:none}
  .cfg *{cursor:none}
  .cfg .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--fg);color:var(--bg);font-weight:500;position:sticky;top:0;z-index:2}
  .cfg .hd button{all:unset;font-size:14px;line-height:1;padding:0 2px}
  .cfg h4{font-weight:500;font-size:10px;letter-spacing:.3em;color:var(--fg);padding:16px 16px 8px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .cfg h4::before{content:"";width:6px;height:6px;background:var(--fg);transform:rotate(45deg)}
  .cfg .grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding:0 16px 14px}
  .cfg label.tg{display:flex;align-items:center;gap:9px;padding:5px 0;transition:color .2s}
  .cfg label.tg:hover{color:var(--fg)}
  .cfg input[type=checkbox]{appearance:none;width:11px;height:11px;border:1px solid var(--mid);margin:0;flex:none;position:relative;transition:.2s}
  .cfg input[type=checkbox]:checked{background:var(--fg);border-color:var(--fg)}
  .cfg input[type=checkbox]:checked::after{content:"";position:absolute;inset:2px;background:var(--bg)}
  .cfg .rg{padding:6px 16px 8px}
  .cfg .rg .top{display:flex;justify-content:space-between;margin-bottom:7px}
  .cfg .rg .top b{color:var(--fg);font-weight:400}
  .cfg input[type=range]{appearance:none;width:100%;height:12px;background:transparent;margin:0}
  .cfg input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--dim)}
  .cfg input[type=range]::-moz-range-track{height:1px;background:var(--dim)}
  .cfg input[type=range]::-webkit-slider-thumb{appearance:none;width:10px;height:10px;background:var(--fg);margin-top:-4.5px;transform:rotate(45deg)}
  .cfg input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--fg);border:0;border-radius:0;transform:rotate(45deg)}
  .cfg .row2{display:flex;align-items:center;justify-content:space-between;padding:6px 16px}
  .cfg input[type=color]{appearance:none;width:44px;height:20px;border:1px solid var(--dim);padding:0;background:none}
  .cfg input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  .cfg input[type=color]::-webkit-color-swatch{border:0}
  .cfg .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 16px 14px}
  .cfg .presets button,.cfg .acts button{all:unset;text-align:center;border:1px solid var(--dim);padding:7px 0;color:var(--mid);transition:.2s;font-size:9px;letter-spacing:.18em}
  .cfg .presets button i{display:block;height:6px;margin:0 8px 6px}
  .cfg .presets button:hover,.cfg .acts button:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .cfg .tx{padding:6px 16px}
  .cfg .tx span{display:block;margin-bottom:6px}
  .cfg input[type=text]{width:100%;background:transparent;border:0;border-bottom:1px solid var(--dim);color:var(--fg);
    font:12px var(--mono);letter-spacing:.12em;padding:5px 0;outline:none}
  .cfg input[type=text]:focus{border-color:var(--fg)}
  .cfg .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 16px 18px}
  .cfg .acts button.wide{grid-column:span 2;background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .cfg .acts button.wide:hover{background:transparent;color:var(--fg)}
  .cfg .foot{padding:10px 16px 16px;color:var(--dim);font-size:9px;border-top:1px solid var(--line);line-height:1.7}

  @media (max-width:640px){.tr,.bl{display:none}.panel{font-size:9px}}

  .cfgBtn,.cfg .hd button,.cfg .acts button,.cfg .presets button{min-height:44px;cursor:pointer}
  .cfg{width:min(320px,calc(100% - 32px))}
  .cfg label.tg{min-height:36px}
  button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
  @media(max-width:640px){.tl{top:24px;left:24px;font-size:8px;letter-spacing:.04em}.br{right:24px;bottom:56px;font-size:8px}.cfgBtn{top:auto;bottom:14px}.hint{display:none}.title{bottom:19vh;max-width:90%;white-space:normal}.title h1{font-size:clamp(24px,7vw,42px);letter-spacing:.1em}.title p{font-size:9px;letter-spacing:.16em}.stage{padding-bottom:12vh}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.shape,#logoStroke{stroke-dashoffset:0!important}.pop,.lock,.tag,.frame,.corner,#logoFill{opacity:1!important}.slice,.pulse,#scanBar,#logoHatch,.cursor::after{display:none!important}}

</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="stage">
<svg id="hud" viewBox="-400 -400 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(60)">
      <rect width="1" height="3" fill="#f2f2f2"/>
    </pattern>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f2" stop-opacity="0"/>
      <stop offset=".85" stop-color="#f2f2f2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".9"/>
    </linearGradient>
    <path id="logoPath" d="M0 0 64 110 80 83 96 110 120 69 143 110 159 110 127 55 159 0 143 0 96 83 88 69 127 0 32 0 64 55 80 28 64 28 56 14 104 14 64 83 16 0z"/>
    <clipPath id="sl1"><rect x="-10" y="20" width="180" height="14"/></clipPath>
    <clipPath id="sl2"><rect x="-10" y="70" width="180" height="10"/></clipPath>
  </defs>

  <!-- warstwy z paralaksą: każda .par przesuwa się wg kursora -->
  <g class="par" data-d="5"><g class="spin cw hov" id="ticks" data-tip="scale"></g></g>
  <g class="par" data-d="10"><g class="spin ccw hov" id="hexOuter" data-tip="hex"></g></g>
  <g class="par" data-d="16"><g class="spin cw2 hov" id="tri" data-tip="tri"></g></g>
  <g class="par" data-d="22"><g class="spin ccw2 hov" id="segs" data-tip="seg"></g></g>

  <polygon class="pulse" id="pul1"/>
  <polygon class="pulse p2" id="pul2"/>

  <g class="par" data-d="-6" id="logoLayer">
    <g transform="translate(-140 -96.25) scale(1.75)">
      <use id="logoEcho" href="#logoPath"/>
      <use id="logoEcho2" href="#logoPath"/>
      <use id="logoHatch" href="#logoPath"/>
      <use id="logoFill" href="#logoPath"/>
      <use class="slice" href="#logoPath" clip-path="url(#sl1)"/>
      <use class="slice s2" href="#logoPath" clip-path="url(#sl2)"/>
      <path id="logoStroke" pathLength="1" vector-effect="non-scaling-stroke"
        d="M0 0 64 110 80 83 96 110 120 69 143 110 159 110 127 55 159 0 143 0 96 83 88 69 127 0 32 0 64 55 80 28 64 28 56 14 104 14 64 83 16 0z"/>
      <rect id="logoHit" class="hitFill" x="-6" y="-6" width="171" height="122" data-tip="logo"/>
    </g>

    <g id="scanBar">
      <rect x="-170" y="-34" width="340" height="34" fill="url(#scanGrad)"/>
      <line x1="-185" x2="185" y1="0" y2="0" stroke="#fff" stroke-width="1"/>
      <rect x="-189" y="-3" width="6" height="6" fill="#fff"/>
      <rect x="183" y="-3" width="6" height="6" fill="#fff"/>
    </g>

    <g class="lockWrap spin">
      <g class="lock spin">
        <path d="M-165 -125 h30 M-165 -125 v30 M-165 -125 l12 12"/>
        <path d="M165 -125 h-30 M165 -125 v30 M165 -125 l-12 12"/>
        <path d="M-165 125 h30 M-165 125 v-30 M-165 125 l12 -12"/>
        <path d="M165 125 h-30 M165 125 v-30 M165 125 l-12 -12"/>
      </g>
    </g>
    <g class="tag"><rect x="-165" y="-152" width="132" height="17"/><text x="-158" y="-140">▲ TARGET LOCKED</text></g>
    <g class="tag"><rect x="61" y="135" width="104" height="17"/><text x="68" y="147">ID WWK-0001</text></g>
  </g>
</svg>
</div>

<div class="vignette"></div>
<div class="frame"></div>
<div class="corner a"></div><div class="corner b"></div>
<div class="corner c"></div><div class="corner d"></div>

<div class="panel tl" id="boot"></div>
<div class="panel tr">
  <div class="row" data-t="900">SYS.TIME <b id="clock">00:00:00</b></div>
  <div class="row" data-t="1100">FRAME <b id="frame">000000</b></div>
  <div class="row" data-t="1300">LAT <b id="lat">52.2297</b> LON <b id="lon">21.0122</b></div>
  <div class="row" data-t="1500">SIGNAL <span class="bar"><i id="sig"></i></span></div>
</div>
<div class="panel bl">
  <div class="row" data-t="2000"><span class="sq f"></span>GEOMETRY <b>60° / HEX</b></div>
  <div class="row" data-t="2200"><span class="sq" id="nodeSq"></span>NODES <b id="nodes">0</b>/128</div>
  <div class="row" data-t="2400"><span class="sq"></span>RENDER <span class="bar"><i id="render"></i></span></div>
</div>
<div class="panel br">
  <div class="row" data-t="2600">MODE <b>MONO / VECTOR</b></div>
  <div class="row" data-t="2800">CURSOR <b id="hex">X0000 Y0000</b></div>
  <div class="row" data-t="3000">STATUS <b id="status">CALIBRATING</b></div>
</div>

<div class="title">
  <h1 id="title"></h1>
  <p id="sub"></p>
</div>
<button class="cfgBtn" id="cfgBtn" aria-controls="cfg" aria-expanded="false">■ CONFIG [C]</button>
<aside class="cfg" id="cfg"></aside>
<div class="hint">CLICK LOGO TO REPLAY · CLICK BACKGROUND TO PULSE</div>

<div class="tip" id="tip"><div class="h"><span id="tipH"></span><span id="tipN"></span></div><div class="b" id="tipB"></div></div>
<div class="cur" id="cur"></div>
<div class="cdot" id="cdot"></div>
<div class="ccoord" id="ccoord"></div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const body = document.body;
  const $ = id => document.getElementById(id);

  /* ---------- konfiguracja (stan) ---------- */
  const DEF = {
    ticks:true, hex:true, tri:true, segs:true, lock:true, logoAnim:true,
    panels:true, titleOn:true, frame:true, hint:true, vignette:true,
    grid:true, dots:true, links:true, radar:true, particles:true,
    glitch:true, cursor:true, tips:true, parallax:true,

    r.setProperty("--fg", C.fg); r.setProperty("--bg", C.bg);
    r.setProperty("--mid", mix(C.fg, C.bg, .58)); r.setProperty("--dim", mix(C.fg, C.bg, .32)); r.setProperty("--line", mix(C.fg, C.bg, .14));
    C.rgb = hex2rgb(C.fg).join(",");
    const [R, G, B] = hex2rgb(C.bg), light = (R * .299 + G * .587 + B * .114) > 140;
    document.querySelector(".vignette").style.opacity = light ? .25 : 1;
  }
  let partsN = C.count;
  function apply(save = true) {
    Object.keys(HIDE).forEach(k => body.classList.toggle("off-" + k, !C[k]));
    const r = document.documentElement.style;
    r.setProperty("--spd", C.spd); r.setProperty("--size", C.size);
    applyColors();
    if (partsN !== C.count) { partsN = C.count; makeParts(); }
    if (!C.cursor) setHot(null);
    // synchronizacja kontrolek
    cfg.querySelectorAll("[data-k]").forEach(inp => {
      const k = inp.dataset.k;
      if (inp.type === "checkbox") inp.checked = !!C[k];
      else if (document.activeElement !== inp) inp.value = C[k];
    });
    RANGES.forEach(([k,,,,, f]) => cfg.querySelector(`[data-v="${k}"]`).textContent = f(+C[k]));
    
  }

  cfg.addEventListener("input", e => {
    const inp = e.target, k = inp.dataset.k; if (!k) return;
    if (inp.type === "checkbox") C[k] = inp.checked;
    else if (inp.type === "range") C[k] = +inp.value;
    else C[k] = inp.value;
    if (k === "title" && body.dataset.done) $("title").innerHTML = titleHTML(C.title);
    if (k === "sub" && body.dataset.done) $("sub").textContent = C.sub;
    apply();
  });
  cfg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.preset) { const p = PRESETS.find(x => x[0] === b.dataset.preset); C.fg = p[1]; C.bg = p[2]; apply(); return; }
    const a = b.dataset.act;
    if (a === "close") toggleCfg(false);
    if (a === "replay") start();
    if (a === "reset") { C = {...DEF}; apply(); start(); }
    if (a === "all") { GROUPS.forEach(([, it]) => it.forEach(([k]) => C[k] = true)); apply(); }
    if (a === "min") {
      Object.assign(C, {ticks:true, hex:false, tri:true, segs:false, lock:false, logoAnim:true, panels:false, titleOn:true,
        frame:false, hint:false, grid:false, dots:true, links:false, radar:false, particles:false, glitch:false});
      apply();
    }
    if (a === "copy") {
      const o = {...C}; delete o.rgb;
      const txt = JSON.stringify(o, null, 2);
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
        () => { b.textContent = "COPIED ✓"; setTimeout(() => b.textContent = "COPY JSON", 1400); },
        () => { b.textContent = "UNAVAILABLE"; setTimeout(() => b.textContent = "COPY JSON", 1400); });
    }
  });
  function toggleCfg(force) {
    const open = typeof force === "boolean" ? force : !cfg.classList.contains("open");
    cfg.classList.toggle("open", open); cfgBtn.classList.toggle("on", open); cfgBtn.setAttribute("aria-expanded", String(open)); cfg.inert = !open;
  }
  cfgBtn.addEventListener("click", () => toggleCfg());
  addEventListener("keydown", e => {
    if (e.target.matches("input[type=text]")) return;
    if (e.key === "c" || e.key === "C") toggleCfg();
    if (e.key === "r" || e.key === "R") start();
    if (e.key === "Escape") {
      if (cfg.classList.contains("open")) toggleCfg(false);
      else parent.postMessage({type:'wowk-intro-close'}, '*');
    }
  });
  toggleCfg(false);
  apply(false);

  start();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
