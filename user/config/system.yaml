home:
  alias: /home
pages:
  theme: wdx
  process:
    markdown: true
    twig: false
  markdown:
    extra: true
cache:
  enabled: true
  check:
    method: file
assets:
  css_pipeline: false
  js_pipeline: false
errors:
  display: false
  log: true
debugger:
  enabled: false
twig:
  cache: true
  debug: false
  auto_reload: true
security:
  twig_content:
    process_enabled: false
